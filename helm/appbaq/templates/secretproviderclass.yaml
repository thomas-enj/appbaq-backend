{{- if .Values.backend.secret.keyVault.enabled }}
{{- if and .Values.backend.secret.keyVault.useVMManagedIdentity (not .Values.backend.secret.keyVault.secretProviderClass.clientId) }}
{{- fail "backend.secret.keyVault.secretProviderClass.clientId is required when backend.secret.keyVault.useVMManagedIdentity=true" }}
{{- end }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.backend.secret.keyVault.secretProviderClass.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
{{ include "appbaq.backendLabels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: {{ .Values.backend.secret.keyVault.secretProviderClass.syncToK8sSecretName }}
      type: Opaque
      data:
        - objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.springDatasourceUrl }}
          key: SPRING_DATASOURCE_URL
        - objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.springDatasourceUsername }}
          key: SPRING_DATASOURCE_USERNAME
        - objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.springDatasourcePassword }}
          key: SPRING_DATASOURCE_PASSWORD
        - objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.redisHostname }}
          key: REDIS_HOSTNAME
        - objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.redisPassword }}
          key: REDIS_PASSWORD
        - objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.backendApiKey }}
          key: BACKEND_API_KEY
        - objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.storageAccountName }}
          key: STORAGE_ACCOUNT_NAME
        - objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.storageSasToken }}
          key: STORAGE_SAS_TOKEN
  parameters:
    usePodIdentity: {{ .Values.backend.secret.keyVault.usePodIdentity | quote }}
    useVMManagedIdentity: {{ .Values.backend.secret.keyVault.useVMManagedIdentity | quote }}
{{- if .Values.backend.secret.keyVault.secretProviderClass.clientId }}
    # Keep both keys for compatibility across provider versions.
    userAssignedIdentityID: {{ .Values.backend.secret.keyVault.secretProviderClass.clientId | quote }}
    clientID: {{ .Values.backend.secret.keyVault.secretProviderClass.clientId | quote }}
{{- end }}
    keyvaultName: {{ .Values.backend.secret.keyVault.secretProviderClass.keyVaultName | quote }}
    tenantId: {{ .Values.backend.secret.keyVault.secretProviderClass.tenantId | quote }}
    cloudName: ""
    objects: |
      array:
        - |
          objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.springDatasourceUrl }}
          objectType: secret
        - |
          objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.springDatasourceUsername }}
          objectType: secret
        - |
          objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.springDatasourcePassword }}
          objectType: secret
        - |
          objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.redisHostname }}
          objectType: secret
        - |
          objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.redisPassword }}
          objectType: secret
        - |
          objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.backendApiKey }}
          objectType: secret
        - |
          objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.storageAccountName }}
          objectType: secret
        - |
          objectName: {{ .Values.backend.secret.keyVault.secretProviderClass.objects.storageSasToken }}
          objectType: secret
{{- end }}
