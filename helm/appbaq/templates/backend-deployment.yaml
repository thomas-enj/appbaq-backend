{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "appbaq.backendName" . }}
  namespace: {{ .Values.global.namespace }}
  labels:
{{ include "appbaq.backendLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
{{ include "appbaq.backendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "appbaq.backendLabels" . | nindent 8 }}
    spec:
{{- if .Values.backend.secret.keyVault.enabled }}
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.backend.secret.keyVault.secretProviderClass.name | quote }}
{{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
{{- if .Values.backend.secret.keyVault.enabled }}
          volumeMounts:
            - name: secrets-store-inline
              mountPath: /mnt/secrets-store
              readOnly: true
{{- end }}
          envFrom:
            - configMapRef:
                name: appbaq-backend-config
            - secretRef:
                name: {{ .Values.backend.secret.name }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
{{- end }}
