{{- if .Values.networkPolicy.enabled }}
{{- if .Values.networkPolicy.defaultDenyIngress }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.global.namespace }}
  labels:
{{ include "appbaq.backendLabels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: {{ .Values.global.namespace }}
  labels:
{{ include "appbaq.backendLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
{{ include "appbaq.backendSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.frontendLink.name | quote }}
              app.kubernetes.io/component: {{ .Values.frontendLink.component | quote }}
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
