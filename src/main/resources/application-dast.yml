spring:
  datasource:
    url: jdbc:h2:mem:dastdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false # Avoid replaying PostgreSQL migrations that might be incompatible with H2
  data:
    redis:
      repositories:
        enabled: false
  cache:
    type: none

azure:
  storage:
    account-name: mockstorage
    sas-token: mocktoken
    container-name: mockcontainer

app:
  api-key: "dast-ci-test-key"