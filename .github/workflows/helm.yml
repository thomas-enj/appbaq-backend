name: Helm CI/CD for AppBAQ Backend

on:
  push:
    branches: [main]
    paths:
      - helm/**
      - .github/workflows/helm.yml
  pull_request:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to run on AKS"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy
          - diagnose

permissions:
  contents: read
  id-token: write

env:
  CHART_PATH: helm/appbaq
  RELEASE_NAME: appbaq-backend
  NAMESPACE: appbaq-then

jobs:
  changes:
    name: Detect Helm changes
    runs-on: ubuntu-latest
    outputs:
      helm: ${{ steps.filter.outputs.helm || steps.manual.outputs.helm }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed paths
        id: filter
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v4
        with:
          filters: |
            helm:
              - 'helm/**'
              - '.github/workflows/helm.yml'

      - name: Enable Helm workflow for manual runs
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: echo "helm=true" >> "$GITHUB_OUTPUT"

  lint-and-validate:
    needs: changes
    if: ${{ needs.changes.outputs.helm == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Lint chart
        run: helm lint ${{ env.CHART_PATH }} --strict

      - name: Render manifests
        run: helm template test ${{ env.CHART_PATH }} > /dev/null

  deploy-aks:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy') }}
    needs: lint-and-validate
    environment: aks-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve AKS cluster (query)
        id: aks
        env:
          AKS_TAG_COHORT: ${{ secrets.AKS_TAG_COHORT }}
          AKS_TAG_SCOPE: ${{ secrets.AKS_TAG_SCOPE }}
        run: |
          if [ -z "$AKS_TAG_COHORT" ] || [ -z "$AKS_TAG_SCOPE" ]; then
            echo "Missing AKS_TAG_COHORT or AKS_TAG_SCOPE secret" >&2
            exit 1
          fi

          AKS_COUNT=$(az aks list \
            --query "length([?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'])" -o tsv)

          if [ "$AKS_COUNT" -eq 0 ]; then
            echo "No AKS found with tags cohort=$AKS_TAG_COHORT and scope=$AKS_TAG_SCOPE" >&2
            exit 1
          fi

          if [ "$AKS_COUNT" -gt 1 ]; then
            echo "Multiple AKS found with tags cohort=$AKS_TAG_COHORT and scope=$AKS_TAG_SCOPE" >&2
            echo "Refine AKS tags so they match exactly one cluster." >&2
            exit 1
          fi

          AKS_NAME=$(az aks list \
            --query "[?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'] | [0].name" -o tsv)
          AKS_RESOURCE_GROUP=$(az aks list \
            --query "[?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'] | [0].resourceGroup" -o tsv)

          if [ -z "$AKS_NAME" ] || [ -z "$AKS_RESOURCE_GROUP" ]; then
            echo "Unable to resolve AKS name or resource group" >&2
            exit 1
          fi

          echo "name=$AKS_NAME" >> "$GITHUB_OUTPUT"
          echo "resource_group=$AKS_RESOURCE_GROUP" >> "$GITHUB_OUTPUT"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.aks.outputs.resource_group }}" \
            --name "${{ steps.aks.outputs.name }}" \
            --admin \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Resolve ACR from tags (query)
        id: acr
        env:
          AZURE_TAG_OWNER: ${{ secrets.AZURE_TAG_OWNER }}
          AZURE_TAG_ENVIRONMENT: ${{ secrets.AZURE_TAG_ENVIRONMENT }}
        run: |
          if [ -z "$AZURE_TAG_OWNER" ] || [ -z "$AZURE_TAG_ENVIRONMENT" ]; then
            echo "Missing AZURE_TAG_OWNER or AZURE_TAG_ENVIRONMENT secret" >&2
            exit 1
          fi

          ACR_COUNT=$(az acr list \
            --query "length([?tags.owner=='$AZURE_TAG_OWNER' && tags.environment=='$AZURE_TAG_ENVIRONMENT'])" -o tsv)

          if [ "$ACR_COUNT" -eq 0 ]; then
            echo "No ACR found with tags owner=$AZURE_TAG_OWNER and environment=$AZURE_TAG_ENVIRONMENT" >&2
            exit 1
          fi

          if [ "$ACR_COUNT" -gt 1 ]; then
            echo "Multiple ACR found with tags owner=$AZURE_TAG_OWNER and environment=$AZURE_TAG_ENVIRONMENT" >&2
            echo "Refine tags so they match exactly one ACR." >&2
            exit 1
          fi

          ACR_NAME=$(az acr list \
            --query "[?tags.owner=='$AZURE_TAG_OWNER' && tags.environment=='$AZURE_TAG_ENVIRONMENT'] | [0].name" -o tsv)
          ACR_LOGIN_SERVER=$(az acr list \
            --query "[?tags.owner=='$AZURE_TAG_OWNER' && tags.environment=='$AZURE_TAG_ENVIRONMENT'] | [0].loginServer" -o tsv)

          if [ -z "$ACR_NAME" ] || [ -z "$ACR_LOGIN_SERVER" ]; then
            echo "Unable to resolve ACR name or login server" >&2
            exit 1
          fi

          echo "name=$ACR_NAME" >> "$GITHUB_OUTPUT"
          echo "login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"

      - name: Grant AKS pull access to ACR
        run: |
          ACR_ID=$(az acr show \
            --name "${{ steps.acr.outputs.name }}" \
            --query id -o tsv)
          KUBELET_OBJECT_ID=$(az aks show \
            --name "${{ steps.aks.outputs.name }}" \
            --resource-group "${{ steps.aks.outputs.resource_group }}" \
            --query "identityProfile.kubeletidentity.objectId" -o tsv)

          if [ -z "$ACR_ID" ] || [ -z "$KUBELET_OBJECT_ID" ]; then
            echo "Unable to resolve ACR ID or AKS kubelet identity object ID" >&2
            exit 1
          fi

          ACR_PULL_ASSIGNMENTS=$(az role assignment list \
            --assignee-object-id "$KUBELET_OBJECT_ID" \
            --scope "$ACR_ID" \
            --role AcrPull \
            --include-inherited \
            --query "length(@)" -o tsv)

          if [ "$ACR_PULL_ASSIGNMENTS" -gt 0 ]; then
            echo "AKS already has AcrPull access to ACR; skipping attach."
          else
            echo "AcrPull access is missing; attaching ACR to AKS."
            az aks update \
              --name "${{ steps.aks.outputs.name }}" \
              --resource-group "${{ steps.aks.outputs.resource_group }}" \
              --attach-acr "${{ steps.acr.outputs.name }}"
          fi

      - name: Resolve Key Vault name (query)
        id: kv
        env:
          AZURE_TAG_OWNER: ${{ secrets.AZURE_TAG_OWNER }}
          AZURE_TAG_ENVIRONMENT: ${{ secrets.AZURE_TAG_ENVIRONMENT }}
        run: |
          if [ -z "$AZURE_TAG_OWNER" ] || [ -z "$AZURE_TAG_ENVIRONMENT" ]; then
            echo "Missing AZURE_TAG_OWNER or AZURE_TAG_ENVIRONMENT secret" >&2
            exit 1
          fi

          KV_COUNT=$(az keyvault list \
            --query "length([?tags.owner=='$AZURE_TAG_OWNER' && tags.environment=='$AZURE_TAG_ENVIRONMENT'])" -o tsv)

          if [ "$KV_COUNT" -eq 0 ]; then
            echo "No Key Vault found with tags owner=$AZURE_TAG_OWNER and environment=$AZURE_TAG_ENVIRONMENT" >&2
            exit 1
          fi

          if [ "$KV_COUNT" -gt 1 ]; then
            echo "Multiple Key Vaults found with tags owner=$AZURE_TAG_OWNER and environment=$AZURE_TAG_ENVIRONMENT" >&2
            echo "Refine tags so they match exactly one Key Vault." >&2
            exit 1
          fi

          KEYVAULT_NAME=$(az keyvault list \
            --query "[?tags.owner=='$AZURE_TAG_OWNER' && tags.environment=='$AZURE_TAG_ENVIRONMENT'] | [0].name" -o tsv)

          if [ -z "$KEYVAULT_NAME" ]; then
            echo "Unable to resolve Key Vault name" >&2
            exit 1
          fi

          echo "name=$KEYVAULT_NAME" >> "$GITHUB_OUTPUT"

      - name: Verify Key Vault access for node managed identity
        env:
          KEYVAULT_CLIENT_ID: ${{ secrets.KEYVAULT_CLIENT_ID }}
        run: |
          if [ -z "$KEYVAULT_CLIENT_ID" ]; then
            echo "Missing KEYVAULT_CLIENT_ID secret" >&2
            exit 1
          fi

          # Read the kubelet object ID straight off the AKS resource (ARM).
          KV_IDENTITY_OBJECT_ID=$(az aks show \
            --name "${{ steps.aks.outputs.name }}" \
            --resource-group "${{ steps.aks.outputs.resource_group }}" \
            --query "identityProfile.kubeletidentity.objectId" -o tsv)

          if [ -z "$KV_IDENTITY_OBJECT_ID" ]; then
            echo "Unable to resolve object ID for KEYVAULT_CLIENT_ID" >&2
            exit 1
          fi

          KV_SECRET_PERMISSIONS=$(az keyvault show \
            --name "${{ steps.kv.outputs.name }}" \
            --query "length(properties.accessPolicies[?objectId=='$KV_IDENTITY_OBJECT_ID' && contains(permissions.secrets, 'get') && contains(permissions.secrets, 'list')])" \
            -o tsv)

          if [ "$KV_SECRET_PERMISSIONS" -gt 0 ]; then
            echo "AKS kubelet identity has Key Vault secret get/list access."
          else
            echo "Key Vault secret access is missing. Apply this command locally with an authorized Azure identity:" >&2
            echo 'az keyvault set-policy --name "<KEYVAULT_NAME>" --object-id "<KUBELET_OBJECT_ID>" --secret-permissions get list' >&2
            exit 1
          fi

      - name: Deploy chart
        env:
          KEYVAULT_CLIENT_ID: ${{ secrets.KEYVAULT_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          if [ -z "$KEYVAULT_CLIENT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo "Missing KEYVAULT_CLIENT_ID or AZURE_TENANT_ID secret required by SecretProviderClass" >&2
            exit 1
          fi

          helm upgrade --install "${{ env.RELEASE_NAME }}" "${{ env.CHART_PATH }}" \
            --namespace "${{ env.NAMESPACE }}" \
            --create-namespace \
            --set global.manageNamespace=false \
            --set backend.image.repository="${{ steps.acr.outputs.login_server }}/appbaq-backend" \
            --set backend.secret.keyVault.enabled=true \
            --set backend.secret.keyVault.useVMManagedIdentity=true \
            --set backend.secret.keyVault.secretProviderClass.keyVaultName="${{ steps.kv.outputs.name }}" \
            --set-string backend.secret.keyVault.secretProviderClass.clientId="$KEYVAULT_CLIENT_ID" \
            --set-string backend.secret.keyVault.secretProviderClass.tenantId="$AZURE_TENANT_ID"

      - name: Debug backend deployment
        continue-on-error: true
        run: |
          echo "=== Backend deploy image ==="
          kubectl get deploy appbaq-backend -n "${{ env.NAMESPACE }}" -o jsonpath='{.spec.template.spec.containers[0].image}' ; echo

          echo "=== Backend pod status ==="
          kubectl get pods -n "${{ env.NAMESPACE }}" -l app.kubernetes.io/name=appbaq-backend -o wide || true

          BACKEND_POD=$(kubectl get pod -n "${{ env.NAMESPACE }}" -l app.kubernetes.io/name=appbaq-backend -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$BACKEND_POD" ]; then
            echo "=== Describe backend pod ==="
            kubectl describe pod "$BACKEND_POD" -n "${{ env.NAMESPACE }}" || true
          fi

          echo "=== Backend service and endpoints ==="
          kubectl get svc appbaq-backend -n "${{ env.NAMESPACE }}" -o wide || true
          kubectl get endpoints appbaq-backend -n "${{ env.NAMESPACE }}" -o wide || true

          echo "=== SecretProviderClass and synced secret ==="
          kubectl get secretproviderclass -n "${{ env.NAMESPACE }}" || true
          kubectl describe secretproviderclass appbaq-backend-kv -n "${{ env.NAMESPACE }}" || true
          kubectl get secret appbaq-backend-secret -n "${{ env.NAMESPACE }}" || true

          echo "=== Backend config map values (CORS/storage) ==="
          kubectl get configmap appbaq-backend-config -n "${{ env.NAMESPACE }}" -o jsonpath='{.data.APP_CORS_ALLOWED_ORIGINS}' ; echo
          kubectl get configmap appbaq-backend-config -n "${{ env.NAMESPACE }}" -o jsonpath='{.data.STORAGE_CONTAINER_NAME}' ; echo

          echo "=== Secrets Store CSI driver pods ==="
          kubectl get pods -n kube-system | grep -E 'secrets-store|provider-azure' || true

          echo "=== Recent Secrets Store CSI driver logs ==="
          for pod in $(kubectl get pods -n kube-system -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | grep -E 'secrets-store|provider-azure' || true); do
            echo "--- $pod ---"
            kubectl logs -n kube-system "$pod" --tail=80 || true
          done

          echo "=== Recent backend logs ==="
          kubectl logs -n "${{ env.NAMESPACE }}" deploy/appbaq-backend --tail=160 || true

  destroy-aks:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
    needs: lint-and-validate
    environment: aks-destroy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve AKS cluster (query)
        id: aks
        env:
          AKS_TAG_COHORT: ${{ secrets.AKS_TAG_COHORT }}
          AKS_TAG_SCOPE: ${{ secrets.AKS_TAG_SCOPE }}
        run: |
          if [ -z "$AKS_TAG_COHORT" ] || [ -z "$AKS_TAG_SCOPE" ]; then
            echo "Missing AKS_TAG_COHORT or AKS_TAG_SCOPE secret" >&2
            exit 1
          fi

          AKS_COUNT=$(az aks list \
            --query "length([?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'])" -o tsv)

          if [ "$AKS_COUNT" -eq 0 ]; then
            echo "No AKS found with tags cohort=$AKS_TAG_COHORT and scope=$AKS_TAG_SCOPE" >&2
            exit 1
          fi

          if [ "$AKS_COUNT" -gt 1 ]; then
            echo "Multiple AKS found with tags cohort=$AKS_TAG_COHORT and scope=$AKS_TAG_SCOPE" >&2
            echo "Refine AKS tags so they match exactly one cluster." >&2
            exit 1
          fi

          AKS_NAME=$(az aks list \
            --query "[?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'] | [0].name" -o tsv)
          AKS_RESOURCE_GROUP=$(az aks list \
            --query "[?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'] | [0].resourceGroup" -o tsv)

          if [ -z "$AKS_NAME" ] || [ -z "$AKS_RESOURCE_GROUP" ]; then
            echo "Unable to resolve AKS name or resource group" >&2
            exit 1
          fi

          echo "name=$AKS_NAME" >> "$GITHUB_OUTPUT"
          echo "resource_group=$AKS_RESOURCE_GROUP" >> "$GITHUB_OUTPUT"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.aks.outputs.resource_group }}" \
            --name "${{ steps.aks.outputs.name }}" \
            --admin \
            --overwrite-existing

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.4

      - name: Destroy release
        run: |
          helm uninstall "${{ env.RELEASE_NAME }}" --namespace "${{ env.NAMESPACE }}"

  diagnose-aks:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'diagnose' }}
    needs: lint-and-validate
    environment: aks-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve AKS cluster (query)
        id: aks
        env:
          AKS_TAG_COHORT: ${{ secrets.AKS_TAG_COHORT }}
          AKS_TAG_SCOPE: ${{ secrets.AKS_TAG_SCOPE }}
        run: |
          if [ -z "$AKS_TAG_COHORT" ] || [ -z "$AKS_TAG_SCOPE" ]; then
            echo "Missing AKS_TAG_COHORT or AKS_TAG_SCOPE secret" >&2
            exit 1
          fi

          AKS_NAME=$(az aks list \
            --query "[?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'] | [0].name" -o tsv)
          AKS_RESOURCE_GROUP=$(az aks list \
            --query "[?tags.cohort=='$AKS_TAG_COHORT' && tags.scope=='$AKS_TAG_SCOPE'] | [0].resourceGroup" -o tsv)

          if [ -z "$AKS_NAME" ] || [ -z "$AKS_RESOURCE_GROUP" ]; then
            echo "Unable to resolve AKS name or resource group" >&2
            exit 1
          fi

          echo "name=$AKS_NAME" >> "$GITHUB_OUTPUT"
          echo "resource_group=$AKS_RESOURCE_GROUP" >> "$GITHUB_OUTPUT"

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ steps.aks.outputs.resource_group }}" \
            --name "${{ steps.aks.outputs.name }}" \
            --admin \
            --overwrite-existing

      - name: Live cluster diagnostics
        run: |
          echo "=== Backend pods ==="
          kubectl get pods -n "${{ env.NAMESPACE }}" -l app.kubernetes.io/name=appbaq-backend -o wide

          echo "=== Frontend pods ==="
          kubectl get pods -n "${{ env.NAMESPACE }}" -l app.kubernetes.io/name=appbaq-frontend -o wide || true

          echo "=== Services and endpoints ==="
          kubectl get svc -n "${{ env.NAMESPACE }}" -o wide
          kubectl get endpoints -n "${{ env.NAMESPACE }}" -o wide

          echo "=== Redis config actually injected (hostname/port only, no credentials) ==="
          kubectl get secret appbaq-backend-secret -n "${{ env.NAMESPACE }}" -o jsonpath='{.data.REDIS_HOSTNAME}' | base64 -d ; echo
          kubectl get secret appbaq-backend-secret -n "${{ env.NAMESPACE }}" -o jsonpath='{.data.REDIS_PORT}' | base64 -d ; echo
          kubectl get configmap appbaq-backend-config -n "${{ env.NAMESPACE }}" -o jsonpath='{.data.REDIS_SSL_ENABLED}' ; echo

          echo "=== Redis TCP reachability test from inside the cluster ==="
          REDIS_HOST=$(kubectl get secret appbaq-backend-secret -n "${{ env.NAMESPACE }}" -o jsonpath='{.data.REDIS_HOSTNAME}' | base64 -d)
          REDIS_PORT_VALUE=$(kubectl get secret appbaq-backend-secret -n "${{ env.NAMESPACE }}" -o jsonpath='{.data.REDIS_PORT}' | base64 -d)
          kubectl run redis-connectivity-test --rm -i --restart=Never --image=busybox:1.36 \
            -n "${{ env.NAMESPACE }}" --command --quiet -- \
            sh -c "nc -zvw5 $REDIS_HOST $REDIS_PORT_VALUE" || true

          echo "=== Redis TLS + AUTH test from inside the cluster (password never echoed) ==="
          kubectl run redis-auth-test --rm -i --restart=Never --image=redis:7-alpine \
            -n "${{ env.NAMESPACE }}" \
            --overrides='{"spec":{"containers":[{"name":"redis-auth-test","image":"redis:7-alpine","command":["sh","-c","redis-cli -h $REDIS_HOSTNAME -p $REDIS_PORT --tls -a \"$REDIS_PASSWORD\" --no-auth-warning PING"],"envFrom":[{"secretRef":{"name":"appbaq-backend-secret"}}]}]}}' \
            || true

          BACKEND_POD=$(kubectl get pod -n "${{ env.NAMESPACE }}" -l app.kubernetes.io/name=appbaq-backend -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$BACKEND_POD" ]; then
            echo "=== Describe backend pod ==="
            kubectl describe pod "$BACKEND_POD" -n "${{ env.NAMESPACE }}"

            echo "=== Triggering /api/certifications from inside the cluster (API key never echoed) ==="
            kubectl run api-request-test --rm -i --restart=Never --image=curlimages/curl:8.10.1 \
              -n "${{ env.NAMESPACE }}" \
              --labels='app.kubernetes.io/name=appbaq-frontend,app.kubernetes.io/component=frontend' \
              --overrides='{"metadata":{"labels":{"app.kubernetes.io/name":"appbaq-frontend","app.kubernetes.io/component":"frontend"}},"spec":{"containers":[{"name":"api-request-test","image":"curlimages/curl:8.10.1","command":["sh","-c","curl -sS -m 65 -o /dev/null -w \"HTTP %{http_code} in %{time_total}s\\n\" -H \"X-Api-Key: $BACKEND_API_KEY\" http://appbaq-backend:8080/api/certifications"],"envFrom":[{"secretRef":{"name":"appbaq-backend-secret"}}]}]}}' \
              || true

            # Redact credentials/tokens that could leak into application logs (URLs, Authorization headers, connection strings).
            REDACT='s#://[^/@[:space:]]+:[^/@[:space:]]+@#://***:***@#g; s/([Pp]assword)[=:][^&[:space:]"'"'"']+/\1=***/g; s/(Authorization:[[:space:]]*Bearer)[[:space:]]+[^[:space:]]+/\1 ***/g; s/(AccountKey=)[^;[:space:]]+/\1***/g'

            echo "=== Backend current logs (redacted) ==="
            kubectl logs "$BACKEND_POD" -n "${{ env.NAMESPACE }}" --tail=200 2>/dev/null | sed -E "$REDACT" || true

            echo "=== Backend previous container logs (if it crashed, redacted) ==="
            kubectl logs "$BACKEND_POD" -n "${{ env.NAMESPACE }}" --previous --tail=200 2>/dev/null | sed -E "$REDACT" || true
          fi