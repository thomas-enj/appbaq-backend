name: SCA - Software Composition Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: PR Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Dependency Review Scan
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  trivy-sca:
    name: Full Dependency Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy SCA Scan
        id: trivy_scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scanners: 'vuln'
          severity: 'HIGH,CRITICAL'
          output: 'trivy-sca-report.txt'
          format: 'table'
          exit-code: '1'
        continue-on-error: true

      - name: Generate Job Summary
        if: always()
        run: |
          echo "## 📦 SCA Scan Summary (Dependencies)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          
          if [ -s trivy-sca-report.txt ]; then
            echo "### ⚠️ Vulnerabilities Detected in Dependencies" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            cat trivy-sca-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🟢 **No HIGH or CRITICAL vulnerabilities found in Maven dependencies.**" >> "$GITHUB_STEP_SUMMARY"
          fi
          
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> Scan performed on repository dependencies (pom.xml)." >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce scan result
        if: steps.trivy_scan.outcome == 'failure'
        run: |
          echo "Trivy detected HIGH or CRITICAL vulnerabilities in dependencies. Failing the job."
          exit 1