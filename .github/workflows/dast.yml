name: DAST - OWASP ZAP

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write

jobs:
  zap-scan:
    name: OWASP ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start Azurite (blob storage emulator)
        # StorageConfig's BlobContainerClient bean needs a reachable blob endpoint at startup
        # (createIfNotExists()) -- same image/flags as docker-compose.yml's local dev setup.
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Application JAR
        run: ./mvnw clean package -DskipTests

      - name: Start Spring Boot Application in Background
        run: |
          nohup java -Dspring.profiles.active=dast -jar target/*.jar > app-dast.log 2>&1 &
          
          echo "Waiting for Spring Boot API to become ready..."
          READY=0
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Spring Boot is UP and ready on port 8080."
              READY=1
              break
            elif curl -s http://localhost:8080 > /dev/null 2>&1; then
              echo "Spring Boot port 8080 responded."
              READY=1
              break
            fi
            sleep 2
          done
          
          if [ $READY -ne 1 ]; then
            echo "❌ Application failed to start within timeout. Application logs:"
            cat app-dast.log
            exit 1
          fi

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:8080'
          fail_action: false # Non bloquant, informatif
          issue_title: 'DAST Security Scan Alert'
          allow_issue_writing: false # Informative only, do not create issues

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-scan-reports
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn

      - name: Generate Job Summary
        if: always()
        run: |
          {
            echo "## 🌐 DAST Scan Summary (OWASP ZAP)"
            echo ""
            echo "| Paramètre | Valeur |"
            echo "|---|---|"
            echo "| **Cible scannée** | \`http://localhost:8080\` |"
            echo "| **Type de scan** | Baseline (Passif) |"
            echo "| **Statut bloquant** | Non (Informatif) |"

            if [ -f report_json.json ]; then
              HIGH=$(jq '[.site[].alerts[]? | select(.riskcode=="3")] | length' report_json.json)
              MEDIUM=$(jq '[.site[].alerts[]? | select(.riskcode=="2")] | length' report_json.json)
              LOW=$(jq '[.site[].alerts[]? | select(.riskcode=="1")] | length' report_json.json)
              INFO=$(jq '[.site[].alerts[]? | select(.riskcode=="0")] | length' report_json.json)
              echo "| **Alertes High** | $HIGH |"
              echo "| **Alertes Medium** | $MEDIUM |"
              echo "| **Alertes Low** | $LOW |"
              echo "| **Alertes Informational** | $INFO |"
            else
              echo "| **Alertes** | ⚠️ report_json.json introuvable (le scan a probablement échoué avant de générer un rapport) |"
            fi

            echo ""
            echo "> 📄 Rapports complets (HTML/JSON/Markdown) disponibles dans l'artefact \`zap-scan-reports\` de ce run."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f report_json.json ]; then
            {
              echo ""
              echo "<details><summary>Détail des alertes non passives (Medium/High)</summary>"
              echo ""
              echo "| Risque | Règle | Nb occurrences | URLs (exemples) |"
              echo "|---|---|---|---|"
            } >> "$GITHUB_STEP_SUMMARY"
            jq -r '
              [.site[].alerts[]? | select(.riskcode=="2" or .riskcode=="3")]
              | .[]
              | "| " + .riskdesc + " | " + .alert + " | " + (.count // (.instances | length | tostring)) + " | " + ([.instances[]?.uri] | .[0:2] | join("<br>")) + " |"
            ' report_json.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "| - | Aucune alerte Medium/High | - | - |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi
